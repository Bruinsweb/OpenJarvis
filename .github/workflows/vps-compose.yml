name: VPS Compose safety check

on:
  pull_request:
    paths:
      - "deploy/docker/docker-compose.vps.yml"
      - "deploy/docker/README-VPS.md"
      - ".github/workflows/vps-compose.yml"
      - "deploy/docker/bootstrap-vps.sh"
  push:
    paths:
      - "deploy/docker/docker-compose.vps.yml"
      - ".github/workflows/vps-compose.yml"

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose syntax and private network exposure
        env:
          OPENJARVIS_API_KEY: ci-dummy-token-only
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/docker/bootstrap-vps.sh
          docker compose -f deploy/docker/docker-compose.vps.yml config --quiet
          docker compose -f deploy/docker/docker-compose.vps.yml config --format json > /tmp/openjarvis-vps.json
          python3 - <<'PY'
          import json
          with open("/tmp/openjarvis-vps.json", encoding="utf-8") as f:
              data = json.load(f)
          services = data["services"]
          ports = services["jarvis"].get("ports", [])
          assert len(ports) == 1, "OpenJarvis should publish exactly one port"
          port = ports[0]
          assert port.get("host_ip") == "127.0.0.1", "OpenJarvis must be loopback-only"
          assert port.get("target") == 8000, "Unexpected target port"
          assert str(port.get("published")) == "8000", "Unexpected published port"
          assert not services["ollama"].get("ports"), "Ollama must not publish a port"
          assert services["jarvis"]["environment"]["OPENJARVIS_API_KEY"], "Missing auth"
          assert any(
              volume.get("target") == "/home/openjarvis"
              for volume in services["jarvis"].get("volumes", [])
          ), "Missing persistent OpenJarvis state volume"
          print("VPS networking and volume safety checks passed")
          PY
